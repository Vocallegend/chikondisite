<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      One layout, every screen.

      The site is designed as a 1280px-wide desktop canvas (its content
      container caps at 80rem). Phones and tablets are told the layout
      viewport is that same 1280px, so the browser scales the whole desktop
      page down to fit the screen instead of reflowing it into a separate
      narrow layout. Desktop browsers ignore the width hint, so they are
      unchanged. Zoom is left enabled for anyone who needs to read closer.
    -->
    <meta name="viewport" content="width=1280, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Chikondi — Real connections start with Chikondi</title>
    <meta
      name="description"
      content="Chikondi is an Android dating app for meeting people and building meaningful connections. Download the official APK directly from this site."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chikondi" />
    <meta property="og:title" content="Chikondi — Real connections start with Chikondi" />
    <meta
      property="og:description"
      content="Discover people, make meaningful connections, and explore new possibilities with Chikondi."
    />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #f8fafc; background: #0b0f1a; line-height: 1.6">
        <h1>Chikondi</h1>
        <p>
          This website needs JavaScript to run. You can still download the official
          Chikondi Android app directly: open
          <a style="color: #ff5a6a" href="/downloads/chikondi.apk">/downloads/chikondi.apk</a>
          in your browser.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
